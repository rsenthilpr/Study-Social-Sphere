name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend route tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialmedia-functions/functions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches engines.node in socialmedia-functions/functions/package.json
          # and the Cloud Functions runtime.
          node-version: '22'
          cache: npm
          cache-dependency-path: socialmedia-functions/functions/package-lock.json

      - run: npm ci

      - run: npm test

      # Fails the build on any known vulnerability at moderate or above, so a
      # dependency bump cannot quietly reintroduce one.
      - name: npm audit
        run: npm audit --audit-level=moderate
